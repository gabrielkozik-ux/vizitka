<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 980" width="1000" height="980" role="img" aria-labelledby="t2 d2" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t2">Timeline of changes 2026–2028</title>
  <desc id="d2">€3 duty from 1 Jul 2026, €2 handling fee per item from 1 Nov 2026, software as a defective product from 9 Dec 2026, withdrawal button from 1 Jan 2027, sole-trader loan protection proposed from 1 Jan 2028.</desc>
  <defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#0c2340"/><stop offset="100%" stop-color="#081a2e"/></linearGradient></defs>
  <rect width="1000" height="980" fill="url(#bg2)"/>
  <rect x="0" y="0" width="7" height="980" fill="#c35b40"/>
  <text x="60" y="78" font-family="DejaVu Sans" font-weight="700" font-size="38" fill="#ffffff">In force, coming, or just a draft</text>
  <text x="60" y="118" font-family="DejaVu Sans" font-size="22" fill="#aab8c9">Changes for Czech businesses 2026–2028 · as of 3 Nov 2026</text>
  <line x1="250" y1="180" x2="250" y2="812" stroke="#2c4a6e" stroke-width="4"/><text x="210" y="210" font-family="DejaVu Sans" font-weight="700" font-size="30" text-anchor="end" fill="#ffffff">1 Jul 2026</text><circle cx="250" cy="200" r="15" fill="#0c2340" stroke="#dbae6d" stroke-width="5"/><circle cx="250" cy="200" r="7" fill="#dbae6d"/><rect x="295" y="142" width="130" height="34" rx="17" fill="none" stroke="#dbae6d" stroke-width="1.8"/><text x="360" y="165" font-family="DejaVu Sans" font-weight="700" font-size="16" text-anchor="middle" fill="#dbae6d">IN FORCE</text><text x="295" y="216" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#ffffff">€3 duty per goods category</text><text x="295" y="254" font-family="DejaVu Sans" font-size="24" fill="#ccd9ea">parcels under €150 from non-EU countries</text><text x="210" y="358" font-family="DejaVu Sans" font-weight="700" font-size="30" text-anchor="end" fill="#ffffff">1 Nov 2026</text><circle cx="250" cy="348" r="15" fill="#0c2340" stroke="#dbae6d" stroke-width="5"/><circle cx="250" cy="348" r="7" fill="#dbae6d"/><rect x="295" y="290" width="130" height="34" rx="17" fill="none" stroke="#dbae6d" stroke-width="1.8"/><text x="360" y="313" font-family="DejaVu Sans" font-weight="700" font-size="16" text-anchor="middle" fill="#dbae6d">IN FORCE</text><text x="295" y="364" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#ffffff">€2 handling fee per item</text><text x="295" y="402" font-family="DejaVu Sans" font-size="24" fill="#ccd9ea">distance sales from non-EU countries</text><text x="210" y="506" font-family="DejaVu Sans" font-weight="700" font-size="30" text-anchor="end" fill="#ffffff">9 Dec 2026</text><circle cx="250" cy="496" r="15" fill="#0c2340" stroke="#8aa0b8" stroke-width="5"/><rect x="295" y="438" width="166" height="34" rx="17" fill="none" stroke="#8aa0b8" stroke-width="1.8"/><text x="378" y="461" font-family="DejaVu Sans" font-weight="700" font-size="16" text-anchor="middle" fill="#8aa0b8">EU DEADLINE</text><text x="295" y="512" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#ffffff">Software as a defective product</text><text x="295" y="550" font-family="DejaVu Sans" font-size="24" fill="#ccd9ea">Slovakia has its act, Czechia not yet</text><text x="210" y="654" font-family="DejaVu Sans" font-weight="700" font-size="30" text-anchor="end" fill="#ffffff">1 Jan 2027</text><circle cx="250" cy="644" r="15" fill="#0c2340" stroke="#c35b40" stroke-width="5"/><rect x="295" y="586" width="118" height="34" rx="17" fill="none" stroke="#c35b40" stroke-width="1.8"/><text x="354" y="609" font-family="DejaVu Sans" font-weight="700" font-size="16" text-anchor="middle" fill="#c35b40">ENACTED</text><text x="295" y="660" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#ffffff">“Withdraw from contract” button</text><text x="295" y="698" font-family="DejaVu Sans" font-size="24" fill="#ccd9ea">and the right to a human explanation</text><text x="210" y="802" font-family="DejaVu Sans" font-weight="700" font-size="30" text-anchor="end" fill="#ffffff">1 Jan 2028</text><circle cx="250" cy="792" r="15" fill="#0c2340" stroke="#8aa0b8" stroke-width="5"/><rect x="295" y="734" width="94" height="34" rx="17" fill="none" stroke="#8aa0b8" stroke-width="1.8"/><text x="342" y="757" font-family="DejaVu Sans" font-weight="700" font-size="16" text-anchor="middle" fill="#8aa0b8">DRAFT</text><text x="295" y="808" font-family="DejaVu Sans" font-weight="700" font-size="30" fill="#ffffff">Loan protection for sole traders</text><text x="295" y="846" font-family="DejaVu Sans" font-size="24" fill="#ccd9ea">only for contracts concluded afterwards</text>
  <text x="60" y="930" font-family="DejaVu Sans" font-size="20" fill="#6f84a0">gabrielkozik.cz  |  Gabriel Kožík, attorney-at-law</text>
</svg>